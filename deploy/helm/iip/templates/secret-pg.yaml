{{- if .Values.database.embedded }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iip.name" . }}-pg
  labels:
    {{- include "iip.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  # 简化版取舍：密码在 values 里直给、Secret 在此生成。
  # 真要轮换密码请改用 ExternalSecret / sealed-secrets ——
  # 本 chart 不引入额外 CRD 依赖（那会让「简化版」直接变重型版）。
  password: {{ required "database.embedded=true 时必须设置 database.embeddedOpts.password（默认 dev 仅供本机等价环境）" .Values.database.embeddedOpts.password | quote }}
{{- end }}
