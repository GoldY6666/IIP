# 后者跟随产品发版（与 docker-compose.yml / verify-images.py 的标签联动，
# T7.6 发 v0.1.0 时三处一起改）。
version: 0.1.0
appVersion: "0.0-m2"
# 只支持 helm 3（v2 chart api 是兼容性声明，实际模板只用 v3 特性）
kubeVersion: ">=1.21.0-0"
