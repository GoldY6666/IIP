# IIP — 本地联调编排
# 规格依据：docs/IIP-M0详细开发计划.md §T0.6（五服务版本表）
# 规则：所有镜像版本钉死，禁止 latest。
#
# 两组服务：
#   依赖组（官方镜像）：postgres / redis / prometheus / alertmanager / loki
#   应用组（本项目构建）：iip-server / iip-worker
#
# 镜像构建（在仓库根执行，先 build 再 up）：
#   docker build --target server -t iip-server:0.1.0 .
#   docker build --target worker -t iip-worker:0.1.0 .
#   # 或一次性：make image-build
#
# 标签历史：M0~M5 用 0.0-m<n>；T7.6（2026-10-14）起切到 semver 0.1.0。
# 改本文件的应用组标签时，务必与 scripts/verify-images.py 的 IIP_TAG 默认值、
# Makefile 的 IMAGE_TAG、deploy/helm/iip 的 appVersion/tag 同步，
# 否则 compose 会去找一个并未构建的标签，表现为 up 直接失败。
#
# 起停：
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml down        # 保留 named volume 数据
#   docker compose -f deploy/docker-compose.yml down -v     # 连数据一起删（reset）
#
# 注意：应用组用 `profiles: [app]` 隔离。默认 `up -d` 只起依赖组五个服务，
# 与 T0.6 验收标准（五服务全 healthy）保持一致。
# 需要连应用一起起时：docker compose --profile app up -d

name: iip

# ---------------------------------------------------------------- 密码（部署前必读）
# ⚠️ 默认值 `dev` **仅供本地开发**。它不是密钥强度意义上的口令，
#    任何暴露到非本机网络的部署都必须覆盖（见下方 x-pg-password）。
#
# 覆盖方式（推荐，密码只存在于本机 .env，不入库）：
#   echo 'IIP_PG_PASSWORD=<你的强密码>' >> .env
# .env 已在 .gitignore 中（`.env` / `.env.*`，`!.env.example`）。
#
# 不设 IIP_PG_PASSWORD 时回落到 dev —— 这个回落是为了让
# scripts/verify-images.py 等既有验收链路无需额外配置即可跑通。
#
# 注：用 `x-` 前缀的扩展字段承载它，是因为 compose 顶层只允许
# version/services/volumes/networks 等固定键，直接写 IIP_PG_PASSWORD
# 会报「additional properties not allowed」（已实测）。
x-pg-password: &pg-password "${IIP_PG_PASSWORD:-dev}"

# ---------------------------------------------------------------- 公共锚点
# 应用组的镜像与连接串在此集中定义，避免两处漂移。
x-app-image: &app-image iip-server:0.1.0
# 容器内连库走 compose 服务名 postgres:5432（不是宿主机的 5433）。
x-app-env: &app-env
  IIP_PG_URL: "postgres://postgres:${IIP_PG_PASSWORD:-dev}@postgres:5432/iip?sslmode=disable"
  IIP_LOG_LEVEL: "info"

# ---------------------------------------------------------------- T7.5：日志轮转
# json-file 驱动默认不轮转：一个刷日志的服务能把宿主磁盘慢慢吃满
# （联调实测 loki 单日 1.2G，而默认策略下它永不删旧文件）。
# 3 个文件 x 10m 是「够留现场、又不吃盘」的折中；需要更长追溯的部署
# 应改这里或换 journald/fluentd，而不是把 max-size 调大后忘记回来。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ---------------------------------------------------------------- T7.5：资源上限
# 只限 memory、不限 cpu：cpu 限额在共享内核的开发机上容易把健康检查
# 拖到超时（表现为随机 unhealthy，排查方向全错），而内存上限防的是
# 「一个容器 OOM 拖垮整机」这个真会发生的事故。
# 两档量级：数据面（PG/Prom/Loki）512M，控制面（redis/alertmanager/应用组）128-256M。

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    image: postgres:16-alpine
    container_name: iip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # 必须与上方 IIP_PG_URL 中的密码一致 —— 两处都读同一个环境变量，不写两遍
      POSTGRES_PASSWORD: *pg-password
      POSTGRES_DB: iip
      # 与 IIP_PG_URL 中的连接串保持一致；仅本地联调用
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U/-d 与上面环境变量一致，避免默认库不存在导致 unhealthy
      test: ["CMD-SHELL", "pg_isready -U postgres -d iip"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging
    image: redis:7-alpine
    container_name: iip-redis
    restart: unless-stopped
    # V1.0 代码不连 Redis（用 DB polling 替代），此处仅为 V1.x 队列预留占位
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    image: prom/prometheus:v2.54.0
    container_name: iip-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # 保证 Linux 上 host.docker.internal 也可解析，跨平台一致
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  alertmanager:
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging
    image: prom/alertmanager:v0.27.0
    container_name: iip-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 注意：alertmanager 的 /-/healthy 响应体是 "OK"，不是 prometheus 的
    # "Prometheus Server is Healthy."。早先这行是从 prometheus 复制过来的
    # （grep -q Healthy），永远匹配不上，容器恒为 unhealthy。
    # 这里只依赖 wget 的退出码（非 2xx 即非零），不绑上游文案。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    image: grafana/loki:3.1.0
    container_name: iip-loki
    restart: unless-stopped
    # M4 证据采集用；M0 只保证进程健康与 3100 可达
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------- 应用组
  iip-server:
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    image: *app-image
    container_name: iip-server
    profiles: ["app"]
    restart: unless-stopped
    # 用 YAML 合并键在共享锚点之上**追加**拓扑路径（ADR-013）：
    # IIP_TOPOLOGY_FILE 只对 server 有意义（拓扑在 newRouter 里加载），
    # 故不写进 *app-env，避免给 worker 安一个它根本不读的变量。
    environment:
      <<: *app-env
      IIP_TOPOLOGY_FILE: /config/topology.yaml
      # M5 S3：启用前端静态托管（手册 §4.3）。
      #
      # UI 与 API 同源（都用 8080），因此前端 fetch 相对路径 '/api/v1' 直接成立，
      # 不需要配 API 绝对地址、也不需要 CORS。
      #
      # 只加在 iip-server：worker 不起 HTTP 服务，给它这个变量是误导。
      IIP_WEB_ROOT: /usr/share/iip/web
      # M5 S2：UI 侧面板地址（手册 §4.2.2）。**取 localhost 而非服务名** ——
      # 这些地址是内联进 index.html 给**浏览器**点的，浏览器解析的是宿主机
      # 地址，填 prometheus:9090 会让用户点的每个链接都打不开。
      #
      # 刻意不提供 IIP_UI_* 的服务名版本：若部署者确实需要改，
      # 改这里的值即可（compose 是可改的），而给一个"容器内可用"的
      # 默认值会诱使人以为它对浏览器也成立。
      #
      # 不写进 *app-env：worker 不起 HTTP 服务，不消费这些值。
      IIP_UI_PROMETHEUS_URL: http://localhost:9090
      IIP_UI_GRAFANA_URL: http://localhost:3000
      IIP_UI_LOKI_URL: http://localhost:3100
      # M6 S4：UI 访问 token。**默认注释掉**——不配就是完全不开鉴权，
      # 本地 `docker compose --profile app up` 的现有用法零改动可用。
      #
      # 启用方式：取消下面两行注释，并把 token 换成自己的值。
      #
      # 为什么不在这里给一个默认 token：默认 token 等于没有 token
      # （所有部署共享同一个已知值），却让人以为「配过了= 有鉴权」。
      # 「忘了配」需要猜用户意图，而猜错的后果是 UI 打不开。
      #
      # 生效范围只有 /api/v1/*：/healthz 与静态托管放行 ——
      # 否则上面的 healthcheck（不可能带自定义头）会判定服务不健康，
      # 症状是「服务起不来」而真因是鉴权。
      # IIP_AUTH_TOKEN: "换成你自己的强随机串"
      # 启用后前端会自动带上该 token（web/src/api/client.ts），无需改前端。
    volumes:
      # 拓扑是环境相关文件——config/topology.yaml 自述为「示例，请按真实环境替换」，
      # 因此走挂载而非烧进镜像，与 prometheus / alertmanager / loki 的配置供给方式一致。
      # 容器运行层没有 WORKDIR，默认工作目录为 /，故默认相对路径
      # config/topology.yaml 即 /config/topology.yaml，与本变量取值一致。
      - ../config:/config:ro
      # 前端产物（M5 S3）。同样走挂载而非烧进镜像：运行层是 distroless，
      # 没有 node，把 dist 烧进去要先把构建塞进多阶段构建，镜像从 14 MB
      # 涨到 1 MB+ 且前端每次迭代都要重编 —— 与「前端独立迭代」相悖。
      #
      # **前置条件**：web/dist 必须已存在，即先跑过一次
      #   cd web && pnpm install --frozen-lockfile && pnpm run build
      # compose **不会**替你构建前端。dist 不存在时本服务仍能正常起
      # （静态托管是可选能力），但 UI 会 404/500。已写进 deploy/README.md。
      - ../web/dist:/usr/share/iip/web:ro
    ports:
      # 宿主机 8080 -> 容器 8080（与本地裸跑保持一致）
      - "8080:8080"
    depends_on:
      postgres:
        # 等 PG 真能接受查询再启动：server 启动时会自动跑迁移，
        # 库没就绪会导致迁移失败并退出。
        condition: service_healthy
    # 运行层是 distroless，镜像内没有 sh/curl/wget，无法用 HTTP 探针。
    # 改用二进制自身的 --healthcheck 模式：请求本机 /healthz，按结果退出 0/1。
    healthcheck:
      test: ["CMD", "/usr/local/bin/iip-server", "--healthcheck", "--http-addr=:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  iip-worker:
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging
    image: iip-worker:0.1.0
    container_name: iip-worker
    profiles: ["app"]
    restart: unless-stopped
    # M4：采集器地址**只给 worker**，且用 YAML 合并键在 *app-env 之上追加。
    #
    # 为什么不给 server：证据采集是 worker 的职责，server 一条告警都不采。
    # 为什么不能靠默认值：Prom/Loki 采集器开关默认 true，但 buildRegistry 在
    # 「开关开 + 未配地址」时会**跳过注册并打一条 Info**（手册 §4.6 的取舍）——
    # 于是 worker 照常 healthy、照常心跳，而事件永远采不到证据。
    # 症状是「服务全绿但 evidence 表恒空」，排查时完全看不出是配置缺失，
    # 与 ADR-013 的拓扑静默降级同一类。地址写在这里，容器链路才真的验到 M4。
    environment:
      <<: *app-env
      # 容器内连采集器走 compose 服务名，与 IIP_PG_URL 同一套命名。
      IIP_PROM_URL: "http://prometheus:9090"
      IIP_LOKI_URL: "http://loki:3100"
      # M6：trace 采集器**故意不给地址，也不给开关**。
      #
      # 原因：compose 里没有任何链路后端（无 Jaeger / Tempo 服务），
      # 给了地址就会注册一个永远连不上的采集器 —— 那正是 M6 §5 要避免的
      #「看起来在工作、实际永远采不到东西」。
      #
      # 保持默认关闭的收益是：evidence 表里 trace 恒为 0 条，
      # 且**日志明确写了「trace 采集器已禁用」**，
      # 排查时能立刻看出是「没配后端」而不是「采集器坏了」。
      # 接入方式：部署侧自行加一个后端服务，再给 worker 补两行——
      #   IIP_EVIDENCE_TRACE_ENABLED: "true"
      #   IIP_TRACE_URL: "http://<后端服务名>:16686"
    depends_on:
      postgres:
        condition: service_healthy
      # 采集器地址指向这两个服务，故必须等它们就绪——
      # 否则 worker 启动即注册采集器，而第一次采集必然连不上，
      # 表现为「任务进重试」而非「采集器未注册」，两者排查方向完全不同。
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    # T6.3：worker 的指标端口。用 expose 而不是 ports ——
    # 后者会把端口发布到宿主机，等于默认把「进程数/任务重试速率」这类
    # 侦察素材暴露给宿主网络。要抓取时由 compose 网络内的 Prometheus
    # 直连 `iip-worker:9091`；本机调试需要外部访问时再临时加 ports。
    #
    # 与 `IIP_WORKER_METRICS_ADDR` 默认值（:9091）配套，改一处必须改另一处。
    expose:
      - "9091"
    # 仍然**不配 healthcheck**：worker 的指标端点只服务 Prometheus，
    # 不是业务探针；镜像为 distroless（无 sh/curl/wget），凑一个「假探针」
    # 只会得到恒 healthy 的噪声。存活判定仍由 restart 策略兜底。
    # 注意「worker 无监听端口」这句话自 T6.3 起**不再成立**（它有 :9091），
    # 但它依然没有业务 HTTP 端口 —— 两者的区别正是这里不配 HTTP 探针的理由。

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
