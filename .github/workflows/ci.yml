# IIP CI 流水线
# 规格依据：docs/IIP-M0详细开发计划.md §T0.7
# 触发：push 到任意分支 + PR 到 main
# 结构：两个并行 job —— backend（Go）与 frontend（web/，pnpm）
#
# 依赖约定（由后端 P1/P3 产出，CI 只引用不创建）：
#   - 仓库根 go.mod（module: github.com/yu/iip）
#   - 仓库根 .golangci.yml
#   - web/package.json + web/pnpm-lock.yaml（pnpm，Vite react-ts 模板）

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# 同分支新推送取消旧的进行中运行，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 从仓库根 go.mod 读取 Go 版本，避免与本地漂移
          go-version-file: go.mod
          cache: true
          # 默认以 go.mod 的 hash 作为缓存 key（无需指定 go.sum）；缓存不可用时 action 仅告警不失败

      - name: Verify module files are committed
        # 明确失败信息：go.sum 必须先由本地 `go mod tidy` 生成并提交，否则 build/test 无法进行
        run: |
          if [ ! -f go.sum ]; then
            echo "::error::go.sum 缺失。请在本机执行 'go mod tidy' 后提交 go.sum（CI 需要它做模块校验）。"
            exit 1
          fi

      - name: Download modules
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # 版本必须与 .golangci.yml 的配置格式（v1 格式）兼容
          version: v1.61.0
          args: --config=./.golangci.yml --timeout=5m
          # 只在 Go 代码变更时跑由 action 自行判断，这里保持默认

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify lockfile is committed
        # pnpm install --frozen-lockfile 需要 web/pnpm-lock.yaml 已提交；缺失时给出明确指引
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::web/pnpm-lock.yaml 缺失。请在本机 web/ 下执行 'pnpm install' 生成并提交该 lockfile（CI 用 --frozen-lockfile 做可复现安装）。"
            exit 1
          fi

      - name: Set up pnpm
        # 必须显式指定版本，与 web/pnpm-lock.yaml 的 lockfileVersion 兼容（pnpm 9 → lockfileVersion 9）
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 注意：uses: 步骤在仓库根执行，cache-dependency-path 相对仓库根，故为 web/pnpm-lock.yaml
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (src)
        run: pnpm tsc --noEmit

      - name: Type check (e2e)
        # **必须单独跑**：tsconfig.json 的 include 只有 "src"，
        # e2e/ 与 playwright.config.ts 压根不被它检查 ——
        # 不单独 tsc 的话，E2E 里的类型错误要到 Playwright 运行时才炸，
        # 而那时错误会被「服务起不来」这类基础设施问题盖住。
        run: pnpm exec tsc -p tsconfig.e2e.json --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        # OPEN-M5-4 的处置：vitest/jsdom/Testing Library 是新增 devDependency，
        # 之前 CI 里没有任何一步跑 `pnpm test`，等于新写的 114 条用例无人执行。
        run: pnpm run test:unit

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # E2E 要起 PG + 编译 Go 二进制 + 跑浏览器，比前端 job 重
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        # 健康检查必须做：没有它，stack.mjs 起来时 PG 还没 ready，
        # 表现为「connection refused」，而真因是服务没起完。
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: web

    env:
      # stack.mjs 据这组变量定位 PG —— 本机是 D:\pgsql16\bin，CI 上是容器挂载点。
      E2E_PG_BIN: /usr/lib/postgresql/16/bin
      E2E_PG_DATA: /tmp/iip_e2e_pgdata
      E2E_PG_USER: postgres
      E2E_PG_PASSWORD: postgres
      E2E_GO_BIN: /usr/local/go/bin/go
      E2E_SERVER_BIN: /tmp/iip-e2e-server
      # CI 上没有系统 Chrome，必须用 Playwright 自带的 chromium。
      # 本机反之（无网络，装不了浏览器）—— 所以 config 里做成可覆盖。
      PLAYWRIGHT_CHANNEL: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        # --with-deps 同时装系统库；缺库时 Chromium 起不来，
        # 报错是「Host system is missing dependencies」，很难联想到要装什么。
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (E2E 打的是 dist 产物)
        run: pnpm build

      - name: E2E
        # E2E 要打真后端（判据 8/10 的核心是「回读确认落库」，
        # mock 掉接口这 5 条就只剩「前端渲染对不对」）。
        # stack.mjs 负责：建库 → 起 iip-server → 等 /healthz → 跑完回收 PG。
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 7
