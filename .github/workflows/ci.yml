# IIP CI 流水线
# 规格依据：docs/IIP-M0详细开发计划.md §T0.7
# 触发：push 到任意分支 + PR 到 main
# 结构：两个并行 job —— backend（Go）与 frontend（web/，pnpm）
#
# 依赖约定（由后端 P1/P3 产出，CI 只引用不创建）：
#   - 仓库根 go.mod（module: github.com/yu/iip）
#   - 仓库根 .golangci.yml
#   - web/package.json + web/pnpm-lock.yaml（pnpm，Vite react-ts 模板）

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# 同分支新推送取消旧的进行中运行，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    # **job 级超时（2026-10-12 随 golangci-lint v2 迁移新增）**：
    # v2 移除了 `--timeout`（见下方 lint 步骤注释），原先由它兜底的
    # 「lint 异常慢」场景改由这里承担。本机基线：lint ~20s、build ~15s、
    # test ~14s；CI 额外加 -race 与 coverage，约 3-5 分钟。
    # 20 分钟是余量，不是预期耗时——超了通常意味着真有问题，
    # 让它红比让它慢慢挂着更有信息量。
    timeout-minutes: 20
    # **真库集成测试要真 PG**（2026-10-09 静态审查补，硬伤④）：
    # 之前 backend job 既无 services.postgres 也没设 IIP_TEST_PG_URL，
    # internal/testsupport/pg.go:51-57 的 SkipIfNoPG 会 t.Skipf →
    # CI 上真库测试一条不跑，go test 仍 rc=0（**恒绿**）。
    # 这直接违反 M6 DoD「真库 SKIP=0」，且让「ci.yml 跑过」这个信号本身失效。
    #
    # 用 service 容器起 PG16；testsupport 自己 CREATE DATABASE iip_testsession
    # （pg.go:183 createDatabaseIfAbsent，存在则跳过），adminDSN 用默认
    # postgres 库即可，host 名 = service 名 `postgres`（Actions 网络内解決）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # 健康检查必须做：没有它，go test 起来时 PG 还没 ready，
        # 表现为「connection refused」，而真因是服务没起完。
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IIP_TEST_PG_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 从仓库根 go.mod 读取 Go 版本，避免与本地漂移
          go-version-file: go.mod
          cache: true
          # 默认以 go.mod 的 hash 作为缓存 key（无需指定 go.sum）；缓存不可用时 action 仅告警不失败

      - name: Verify module files are committed
        # 明确失败信息：go.sum 必须先由本地 `go mod tidy` 生成并提交，否则 build/test 无法进行
        run: |
          if [ ! -f go.sum ]; then
            echo "::error::go.sum 缺失。请在本机执行 'go mod tidy' 后提交 go.sum（CI 需要它做模块校验）。"
            exit 1
          fi

      - name: Download modules
        run: go mod download

      - name: golangci-lint (linters)
        uses: golangci/golangci-lint-action@v9
        with:
          # ── 版本组合的依据（2026-10-12 联网核实 action README + 本机实测）──
          #
          # `golangci-lint` 必须 ≥ v2：go.mod 已是 `go 1.26` / `toolchain go1.26.9`，
          # 而 v1.61.0（构建于 go1.23.8）加载配置时直接报
          #   can't load config: the Go language version (go1.23) used to build
          #   golangci-lint is lower than the targeted Go version (1.26.0)
          # 退出码 3 —— 与代码质量无关，纯属工具链代际不兼容。
          #
          # **处置是升 lint，绝不降 go.mod**：降 go.mod 会把 govulncheck
          # 刚清掉的 40+ 条标准库 CVE 放回来（升 Go 1.23.8 → 1.26.9 才消掉）。
          #
          # action 必须 ≥ v7：官方兼容表写明「v7.0.0 supports golangci-lint
          # v2 only」「v8.0.0 works with >= v2.1.0」。取最新的 v9.3.0。
          # v9 要求 Node 24 —— GitHub 托管 runner 已满足（自建runner 才需留意）。
          #
          # version 在 v9 文档里标 (optional)，但默认 install-mode=binary 下
          # 期望 v2.x 版本串，**仍须显式写**，不写没有可靠默认。
          version: v2.14.0
          # **`--timeout` 必须删**：golangci-lint v2 已移除该配置项，
          # `migrate` 时会警告 "The configuration `run.timeout` is ignored.
          # By default, in v2, the timeout is disabled."。
          # 超时兜底改由本 job 的 `timeout-minutes` 承担（下方已设 20 分钟：
          # 本机基线 lint ~20s + build ~15s + test ~14s，CI 加race+coverage
          # 约 3-5 分钟，20 分钟留足余量且不会让挂死的 job 占额度）。
          #
          # **附带好处**：action v9 的 `verify` 输入默认 true，会在 lint 前先跑
          # 一次 `golangci-lint config verify` —— 配置写错时立刻报出，
          # 而不是混在一堆 issue 里看不出是配置问题。
          #
          # `--config=` 的等号写法是必需的：action 按空格切分参数，
          # 写成 `--config .golangci.yml` 会被当成两个参数。
          args: --config=./.golangci.yml
          # 只在 Go 代码变更时跑由 action 自行判断，这里保持默认

      - name: gofmt / goimports check
        # **v2 把 gofmt 与 goimports 从 linters 移到了 formatters**
        # （本仓库 .golangci.yml 已随之迁移）。
        # 后果：`golangci-lint run` **不再检查格式** —— 若只留上面那一步，
        # 格式检查会**静默失效**（job 绿，但没人管 gofmt）。
        # ⇒ 必须单独跑 `fmt --diff`：只检查不改文件，有差异即退出非 0。
        #
        # 用 --diff 而非直接 `fmt`：CI 里绝不自动改文件，
        # 否则「本该失败的格式」变成「被悄悄改绿」，掩盖真实问题。
        #
        # **为什么这一步能直接调 `golangci-lint` 裸命令**（2026-10-12 查
        # action v9.3.0 源码 src/run.ts 确认，非推测）：
        #   const binPath = await install().then(plugins.install)
        #   core.addPath(path.dirname(binPath))
        # 该addPath 在 installOnly 提前return **之前**执行，
        # 所以同一 job 里后续 `run:` 步骤的 PATH 已含安装目录。
        # 若哪天 action 改了这一点，本步会 command not found（显式失败，
        # 不是静默跳过 —— 这是刻意的）。
        run: golangci-lint fmt --diff

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        # **`-p 1` 不可省**（2026-10-09 静态审查补）：
        # internal/testsupport/pg.go:104 自己写着「若将来要并行，需改为每个子测试
        # 各自调 NewDB」—— 现在多个包会共用同一个 iip_testsession 库去 CREATE SCHEMA，
        # 并行时互相把对方的 schema 建掉/删掉，整包全挂。
        # 宿主门禁 m4_final_gate.py 早就用 -p 1，**这里必须与它一致**，
        # 否则「本地绿、CI 红」且报错完全不指向真因。
        #
        # 特征识别：并行失败时每条用例都 <2s（本机正常 10s/条），
        # **看起来极像「数据库连不上」，极易误判成产品缺陷**。
        run: go test -p 1 -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify lockfile is committed
        # pnpm install --frozen-lockfile 需要 web/pnpm-lock.yaml 已提交；缺失时给出明确指引
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::web/pnpm-lock.yaml 缺失。请在本机 web/ 下执行 'pnpm install' 生成并提交该 lockfile（CI 用 --frozen-lockfile 做可复现安装）。"
            exit 1
          fi

      - name: Set up pnpm
        # 必须显式指定版本，与 web/pnpm-lock.yaml 的 lockfileVersion 兼容（pnpm 9 → lockfileVersion 9）
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 注意：uses: 步骤在仓库根执行，cache-dependency-path 相对仓库根，故为 web/pnpm-lock.yaml
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (src)
        run: pnpm tsc --noEmit

      - name: Type check (e2e)
        # **必须单独跑**：tsconfig.json 的 include 只有 "src"，
        # e2e/ 与 playwright.config.ts 压根不被它检查 ——
        # 不单独 tsc 的话，E2E 里的类型错误要到 Playwright 运行时才炸，
        # 而那时错误会被「服务起不来」这类基础设施问题盖住。
        run: pnpm exec tsc -p tsconfig.e2e.json --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        # OPEN-M5-4 的处置：vitest/jsdom/Testing Library 是新增 devDependency，
        # 之前 CI 里没有任何一步跑 `pnpm test`，等于新写的 114 条用例无人执行。
        run: pnpm run test:unit

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # E2E 要起 PG + 编译 Go 二进制 + 跑浏览器，比前端 job 重
    timeout-minutes: 20

    # **刻意不用 services.postgres 容器**（2026-10-09 静态审查修正）：
    # web/e2e/stack.mjs 自己就.initdb + 自己 spawn postgres，占的也是 5434
    # （stack.mjs:137`spawn(exe('postgres'), [..., '-p', String(pgPort)])`），
    # 而 stack.mjs:119-124 在 `portBusy(pgPort)` 为真时直接 `process.exit(2)`。
    # ⇒ 声明一个映射 5434 的 service 容器，**一起来就把stack.mjs 顶死**，
    # e2e job 必然红，且报错是「端口已占用」，完全不指向真因。
    #
    # 用runner 预装的 PG 二进制即可（ubuntu-24.04 自带 PG 16.13/16.15，
    # 路径 /usr/lib/postgresql/16/bin，与下面 E2E_PG_BIN 一致）。
    # 注意：**预装的 PG 服务本身是 disabled at boot，但我们要的是二进制
    # 而不是那个服务** —— stack.mjs 用 initdb 在 /tmp 建自己的实例。

    defaults:
      run:
        working-directory: web

    env:
      # stack.mjs 据这组变量定位 PG —— 本机是 D:\pgsql16\bin，CI 上是容器挂载点。
      E2E_PG_BIN: /usr/lib/postgresql/16/bin
      E2E_PG_DATA: /tmp/iip_e2e_pgdata
      E2E_PG_USER: postgres
      E2E_PG_PASSWORD: postgres
      # **E2E_GO_BIN 不在这里写死**（2026-10-19 修）。原先写的是
      # `/usr/local/go/bin/go` —— 那是 **runner 镜像自带的 Go**，
      # 而本 job 下面的「Set up Go」装的是 go.mod 声明的 1.26.9
      # （setup-go 在 Linux 装到 tool cache，**不覆盖 /usr/local/go**）。
      # ⇒ 同一个 job 里 backend 用一个工具链、e2e 用另一个，而
      # 镜像那份若低于 go.mod 的 `go 1.26.0`，Go 会走 GOTOOLCHAIN=auto
      # **静默下载** go1.26.9：能跑，但每次多一次隐藏网络依赖，
      # 且失败时报错完全不指向「用错工具链」这个真因。
      # 现在由「Resolve Go for E2E」步骤用 `go env GOROOT` 写进
      # $GITHUB_ENV —— 永远等于 setup-go 刚装的那一个。
      E2E_SERVER_BIN: /tmp/iip-e2e-server
      # CI 上没有「必须用系统 Chrome」的理由（那是本机约束），必须用
      # Playwright 自带的 chromium。
      # 本机反之（无网络，装不了浏览器）—— 所以 config 里做成可覆盖。
      #
      # **用哨兵值 'none' 而不是空串**（2026-10-09 修正）：
      # 空串经过 YAML → 环境变量这一层是否被保留为 ''（而非 unset）
      # **未经验证**；若被当成 unset，config 会回落到 channel:'chrome'，
      # 而 runner 上没有系统 Chrome ⇒ e2e 挂。哨兵值不依赖这层语义。
      PLAYWRIGHT_CHANNEL: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve Go for E2E
        # 让 stack.mjs 用的 Go **就是** setup-go 刚装的那一个。
        # setup-go 在 Linux 装到 tool cache（不覆盖 /usr/local/go），
        # 所以镜像自带的那份与 go.mod 声明的版本可能不同 ——
        # 写死路径会让「backend 与 e2e 用两个工具链」悄悄成立。
        #
        # 走 $GITHUB_ENV 而不是直接改 env: 块：job 级 env 在步骤开始前
        # 就已固定，拿不到 setup-go 的结果。
        #
        # **这一步失败要显式失败**：`go env GOROOT` 取不到就报错退出，
        # 不许 silently 回落到 PATH 里的 go —— 那正是要消除的歧义源。
        run: |
          set -euo pipefail
          goroot="$(go env GOROOT)"
          if [ -z "$goroot" ] || [ ! -x "$goroot/bin/go" ]; then
            echo "::error::go env GOROOT 未给出可执行的 go（got: '$goroot'）"
            exit 1
          fi
          echo "E2E_GO_BIN=$goroot/bin/go" >> "$GITHUB_ENV"
          echo "E2E will use: $goroot/bin/go ($(go version))"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        # --with-deps 同时装系统库；缺库时 Chromium 起不来，
        # 报错是「Host system is missing dependencies」，很难联想到要装什么。
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (E2E 打的是 dist 产物)
        run: pnpm build

      - name: E2E
        # E2E 要打真后端（判据 8/10 的核心是「回读确认落库」，
        # mock 掉接口这 5 条就只剩「前端渲染对不对」）。
        # stack.mjs 负责：建库 → 起 iip-server → 等 /healthz → 跑完回收 PG。
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 7
